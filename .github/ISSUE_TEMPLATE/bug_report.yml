name: Bug report
description: Report a reproducible MeloPulse problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not include secrets, credentials, private URLs, or repository contents.
  - type: input
    id: version
    attributes:
      label: MeloPulse version
      description: Include the CLI or package version you used.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the smallest commands or MCP calls needed to reproduce the problem.
      placeholder: |
        1. Run ...
        2. Call ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
